# Copy into your APPLICATION repository's .github/workflows/deploy.yml.
# Register/publish the server policy once, using `lta ops server setup`.
# Use an environment with branch restrictions and pre-verified SSH host keys.
name: Deploy application
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install LTA from a reviewed immutable release commit
        env:
          LTA_COMMIT: ${{ vars.LTA_COMMIT }}
        run: |
          [[ "$LTA_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          python -m pip install "git+https://github.com/nimajavan/terminal_agent.git@$LTA_COMMIT"
      - name: Prepare SSH identity and scoped controller profile
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LTA_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LTA_KNOWN_HOSTS }}
          SERVER_HOST: ${{ vars.LTA_SERVER_HOST }}
          APP_NAME: ${{ vars.LTA_APP_NAME }}
          APP_DOMAIN: ${{ vars.LTA_APP_DOMAIN }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/lta_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          lta ops server add production --host "$SERVER_HOST" \
            --identity "$HOME/.ssh/lta_deploy" --apps "$APP_NAME" --domains "$APP_DOMAIN" \
            --operations deploy rollback backup
      - name: Build, test, release and verify
        run: lta deploy . --server production --autonomous --wait --wait-timeout 3300
